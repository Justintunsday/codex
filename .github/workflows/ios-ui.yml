name: Native iOS UI verification

on:
  push:
    branches: ["codex/ios-native"]
    paths: [".github/workflows/ios-ui.yml"]
  workflow_dispatch:
    inputs:
      device:
        type: choice
        options: [all, ipad]
        default: all
      testScope:
        type: choice
        options: [all, accessibility]
        default: all

permissions:
  contents: read

concurrency:
  group: ios-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ui:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            codex-rs/target
            ios/Build/Cargo
          key: ios-ui-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ios-${{ runner.os }}-${{ runner.arch }}-rust195-
      - name: Install simulator build tools
        run: |
          brew install xcodegen
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add aarch64-apple-ios-sim --toolchain 1.95.0
          cd ios
          xcodegen generate
      - name: Build signed simulator tests
        run: |
          set -o pipefail
          xcodebuild -project ios/Codex.xcodeproj -scheme Codex -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/Build/Simulator \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Automatic GENERATE_INFOPLIST_FILE=YES build-for-testing 2>&1 | tee ios/Build/ui-build.log
      - name: Select iPhone and iPad
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for family in ('iPhone', 'iPad'):
              matches = [(runtime, device) for runtime, group in devices.items() if '.iOS-' in runtime for device in group if family in device['name'] and device.get('isAvailable')]
              if not matches:
                  raise SystemExit(f'No {family} simulator available')
              runtime, device = sorted(matches, key=lambda match: match[0], reverse=True)[0]
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'{family.lower()}={device["udid"]}\n')
          PY
      - name: Test each device with a fresh boot
        run: |
          set -o pipefail
          test_arguments=()
          if [ '${{ inputs.testScope }}' = accessibility ]; then
            test_arguments+=('-only-testing:CodexUITests/WorkspaceUITests/testDarkAppearanceWithLargeDynamicType')
          fi
          for destination in '${{ steps.simulator.outputs.iphone }}' '${{ steps.simulator.outputs.ipad }}'; do
            if [ '${{ inputs.device }}' = ipad ] && [ "$destination" != '${{ steps.simulator.outputs.ipad }}' ]; then
              continue
            fi
            xcrun simctl shutdown all
            xcrun simctl boot "$destination"
            xcrun simctl bootstatus "$destination" -b
            xcodebuild -project ios/Codex.xcodeproj -scheme Codex -configuration Debug \
              -destination "id=$destination" -derivedDataPath ios/Build/Simulator \
              -skipPackagePluginValidation -resultBundlePath "ios/Build/UI-$destination.xcresult" \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Automatic GENERATE_INFOPLIST_FILE=YES "${test_arguments[@]}" test-without-building
            xcrun simctl shutdown "$destination"
          done
      - name: Export UI screenshots
        if: always()
        run: |
          for result in ios/Build/UI-*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "ios/Build/Screenshots/$(basename "$result" .xcresult)"
            fi
          done
          xcrun simctl shutdown all
      - name: Upload UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Codex-iOS-UI
          if-no-files-found: warn
          retention-days: 14
          path: |
            ios/Build/UI-*.xcresult
            ios/Build/Screenshots
            ios/Build/ui-build.log
            ios/Codex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
