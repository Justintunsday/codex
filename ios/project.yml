name: Codex
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: org.codex.native-ios
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
targets:
  Codex:
    type: application
    platform: iOS
    sources:
      - Codex
      - Bridge
      - path: ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Codex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Bridge/CodexBridge.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Build/Rust/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lcodex_ios_ffi", "-lc++", "-lz", "-liconv", "-framework", "Security", "-framework", "SystemConfiguration", "-framework", "CoreFoundation"]
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Codex
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    preBuildScripts:
      - name: Build Rust runtime
        script: bash "$SRCROOT/Scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
  CodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Codex
schemes:
  Codex:
    build:
      targets:
        Codex: all
        CodexUITests: [test]
    test:
      targets: [CodexUITests]
